name: hash-watch

# UBI-222: rebuilt on top of manifest.json's own new schema_urls field
# (ubx-provider-dynamic PR #50) instead of ubiquex's own live
# [dynamic_provider_groups.aws_data_all] table -- UBI-182 Stage E
# collapsed that table down to a bare source/version pin months ago,
# and this file's own Smithy half was never updated to match. It kept
# reading a table that no longer existed: a real KeyError on the very
# first line that touched it, confirmed failed on 2026-08-27, a red X
# nobody saw. The CFN half is untouched -- it was always self-
# contained (a single, real, live registry zip, no group at all) and
# never depended on the now-gone table.
#
# Three real states for BOTH halves together, never conflated:
#   clean -- checked, both the CFN zip and every Smithy member's own
#     live content match the last cut snapshot.
#   drift -- checked, either half changed. Opens a tracking issue
#     naming exactly what changed (never auto-regenerates the Smithy
#     half's own bundled snapshot -- cutting a new one, publishing it,
#     and bumping ubiquex's own pin is a real, judgment-requiring act
#     this workflow does not take unattended, matching this org's own
#     publish-descriptions.yml precedent for exactly this kind of
#     cut). The CFN half alone can still regenerate directly below,
#     same as before -- it was never blocked by this bug.
#   error -- could NOT check (manifest.json has no schema_urls yet
#     because this snapshot hasn't been re-cut with a binary new
#     enough to record it, a live fetch failed, etc.). Opens a
#     SEPARATE tracking issue, its own label -- an error must never
#     look like "nothing to report" from outside CI.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  REPO_NAME: aws
  SCHEMA_REPO: ubx-schema-aws
  ERROR_ISSUE_LABEL: hash-watch-error
  DRIFT_ISSUE_LABEL: hash-watch-drift

jobs:
  check-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-sdk-aws
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up PyYAML
        run: pip install --quiet pyyaml

      - name: Fetch the real AWS CloudFormation schema zip and compute its canonicalized-content spec-sha256
        id: cfn
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib, io, json, os, time, urllib.error, urllib.request, zipfile, datetime

          URL = "https://schema.cloudformation.us-east-1.amazonaws.com/CloudformationSchema.zip"

          def fetch(url, retries=5):
              req = urllib.request.Request(url, headers={"User-Agent": "ubx-hash-watch"})
              for i in range(retries):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          return resp.read()
                  except urllib.error.HTTPError as e:
                      if i == retries - 1:
                          raise
                      retry_after = e.headers.get("Retry-After") if e.code == 429 else None
                      time.sleep(float(retry_after) if retry_after else 5 * (2 ** i))
                  except Exception:
                      if i == retries - 1:
                          raise
                      time.sleep(5 * (2 ** i))

          def json_default(o):
              if isinstance(o, (datetime.date, datetime.datetime)):
                  return o.isoformat()
              raise TypeError(f"not JSON serializable: {o!r}")

          def canonicalize(doc):
              if isinstance(doc, dict) and "revision" in doc:
                  doc = {k: v for k, v in doc.items() if k != "revision"}
              return json.dumps(doc, sort_keys=True, separators=(",", ":"), default=json_default).encode("utf-8")

          try:
              zip_bytes = fetch(URL)
              zf = zipfile.ZipFile(io.BytesIO(zip_bytes))
              names = sorted(n for n in zf.namelist() if not n.endswith("/"))

              h = hashlib.sha256()
              for name in names:
                  doc = json.loads(zf.read(name).decode("utf-8"))
                  h.update(canonicalize(doc))

              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"hash={h.hexdigest()}\n")
                  out.write("ok=true\n")
              print(f"Live CFN canonicalized spec-sha256: {h.hexdigest()} ({len(names)} files)")
          except Exception as e:
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("ok=false\n")
                  out.write(f"error={e!r}\n")
          PYEOF

      - name: Fetch manifest.json and every real Smithy member's own live spec, compute the merged-spec-sha256
        id: smithy
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import hashlib, json, os, time, urllib.error, urllib.request, yaml, datetime

          SCHEMA_REPO = os.environ["SCHEMA_REPO"]

          def write_output(**kv):
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  for k, v in kv.items():
                      out.write(f"{k}={v}\n")

          def fetch(url, retries=5):
              req = urllib.request.Request(url, headers={"User-Agent": "ubx-hash-watch"})
              for i in range(retries):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return resp.read()
                  except urllib.error.HTTPError as e:
                      if i == retries - 1:
                          raise
                      retry_after = e.headers.get("Retry-After") if e.code == 429 else None
                      time.sleep(float(retry_after) if retry_after else 5 * (2 ** i))
                  except Exception:
                      if i == retries - 1:
                          raise
                      time.sleep(5 * (2 ** i))

          def json_default(o):
              if isinstance(o, (datetime.date, datetime.datetime)):
                  return o.isoformat()
              raise TypeError(f"not JSON serializable: {o!r}")

          def canonicalize(raw_bytes):
              text = raw_bytes.decode("utf-8")
              try:
                  doc = json.loads(text)
              except json.JSONDecodeError:
                  doc = yaml.safe_load(text)
              if isinstance(doc, dict) and "revision" in doc:
                  doc = {k: v for k, v in doc.items() if k != "revision"}
              return json.dumps(doc, sort_keys=True, separators=(",", ":"), default=json_default).encode("utf-8")

          try:
              manifest_url = f"https://raw.githubusercontent.com/Ubiquex/{SCHEMA_REPO}/main/manifest.json"
              manifest = json.loads(fetch(manifest_url))
              schema_urls = manifest.get("schema_urls") or {}
              # "aws" itself is the CFN member (its own real fetch is the
              # independent zip hash above, not a flat spec document) --
              # excluded here exactly like the old, live-config version
              # of this file already excluded it.
              members = sorted(m for m in manifest.get("members", []) if m != "aws")

              if not schema_urls:
                  write_output(
                      ok="false",
                      error=f"{SCHEMA_REPO}'s own manifest.json has {len(members)} real Smithy member(s) but no "
                            f"schema_urls at all -- this provider's own snapshot has not been re-cut with a "
                            f"ubx-provider-dynamic build new enough to record it yet (UBI-222, PR #50).",
                  )
              else:
                  missing = [m for m in members if m not in schema_urls]
                  distinct_urls = sorted(set(schema_urls[m] for m in members if m in schema_urls))
                  h = hashlib.sha256()
                  for i, url in enumerate(distinct_urls):
                      if i > 0:
                          time.sleep(1.0)
                      h.update(canonicalize(fetch(url)))
                  write_output(ok="true", hash=h.hexdigest(), members=len(members), missing=len(missing))
                  print(f"Live Smithy merged-spec-sha256: {h.hexdigest()} ({len(members)} members, {len(missing)} missing a schema_url)")
          except Exception as e:
              write_output(ok="false", error=repr(e))
          PYEOF

      - name: Compare against this repo's committed VERSION
        id: compare
        run: |
          set -euo pipefail
          current_cfn="$(grep '^spec-sha256:' VERSION | awk '{print $2}')"
          current_smithy_hash="$(grep '^smithy-merged-spec-sha256:' VERSION | awk '{print $2}')"
          current_smithy_members="$(grep '^smithy-members:' VERSION | awk '{print $2}')"

          if [ "${{ steps.cfn.outputs.ok }}" != "true" ] || [ "${{ steps.smithy.outputs.ok }}" != "true" ]; then
            state=error
            detail="cfn ok=${{ steps.cfn.outputs.ok }} (${{ steps.cfn.outputs.error }}); smithy ok=${{ steps.smithy.outputs.ok }} (${{ steps.smithy.outputs.error }})"
          elif [ "${{ steps.smithy.outputs.missing }}" != "0" ]; then
            state=error
            detail="manifest.json's own schema_urls is missing ${{ steps.smithy.outputs.missing }} of ${{ steps.smithy.outputs.members }} real Smithy member(s) -- partial data is not a safe basis for a real compare."
          elif [ "${{ steps.cfn.outputs.hash }}" = "$current_cfn" ] && [ "${{ steps.smithy.outputs.hash }}" = "$current_smithy_hash" ] && [ "${{ steps.smithy.outputs.members }}" = "$current_smithy_members" ]; then
            state=clean
            detail="cfn spec-sha256 and smithy merged-spec-sha256 both match VERSION."
          else
            state=drift
            detail="cfn: ${{ steps.cfn.outputs.hash }} (was $current_cfn) -- smithy: ${{ steps.smithy.outputs.hash }} / ${{ steps.smithy.outputs.members }} members (was $current_smithy_hash / $current_smithy_members)"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "current_cfn=$current_cfn" >> "$GITHUB_OUTPUT"

      - name: Find any existing error/drift tracking issue
        id: existing
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          error_number="$(gh issue list --label "$ERROR_ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          drift_number="$(gh issue list --label "$DRIFT_ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')"
          echo "error_number=$error_number" >> "$GITHUB_OUTPUT"
          echo "drift_number=$drift_number" >> "$GITHUB_OUTPUT"

      - name: Surface an error state -- never allowed to look like "nothing to report"
        if: steps.compare.outputs.state == 'error'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="**hash-watch could not fully check this repo for drift.**

          ${{ steps.compare.outputs.detail }}

          Full workflow run: $run_url"
          if [ -n "${{ steps.existing.outputs.error_number }}" ]; then
            gh issue comment "${{ steps.existing.outputs.error_number }}" --body "$body"
          else
            gh issue create --title "hash-watch: unable to check for drift" --label "$ERROR_ISSUE_LABEL" --body "$body"
          fi

      - name: Close a stale error tracking issue once checking works again
        if: steps.compare.outputs.state != 'error' && steps.existing.outputs.error_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue close "${{ steps.existing.outputs.error_number }}" \
            --comment "hash-watch checked successfully on this run (state: ${{ steps.compare.outputs.state }}) -- closing."

      # --- everything below only runs when real drift was actually found ---

      - name: Report Smithy-side drift -- opens a tracking issue, never auto-regenerates that half
        if: steps.compare.outputs.state == 'drift'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="**Real schema drift found against the live source.**

          ${{ steps.compare.outputs.detail }}

          The CFN half regenerates automatically below when its own hash moved. The Smithy half does
          not: cutting a new pinned snapshot, publishing it as a new $SCHEMA_REPO release, and bumping
          ubiquex's own [dynamic_providers.$REPO_NAME] pin is a real, judgment-requiring act -- not
          auto-applied here (this org's own publish-descriptions.yml sets the same precedent for this
          class of cut). See ubx-provider-dynamic's own --generate-snapshot-group.

          Full workflow run: $run_url"
          if [ -n "${{ steps.existing.outputs.drift_number }}" ]; then
            gh issue comment "${{ steps.existing.outputs.drift_number }}" --body "$body"
          else
            gh issue create --title "hash-watch: real drift found against the live source" --label "$DRIFT_ISSUE_LABEL" --body "$body"
          fi

      - name: Close a stale drift tracking issue once content is clean again
        if: steps.compare.outputs.state == 'clean' && steps.existing.outputs.drift_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue close "${{ steps.existing.outputs.drift_number }}" \
            --comment "hash-watch found this repo clean on this run -- closing."

      - name: Check out ubiquex (to build ubx from source, CFN-half regen only)
        if: steps.compare.outputs.state == 'drift' && steps.cfn.outputs.hash != steps.compare.outputs.current_cfn
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules \
            "https://github.com/Ubiquex/ubiquex.git" \
            "${{ runner.temp }}/ubiquex-src"
          git clone --depth=1 \
            "https://github.com/Ubiquex/ubx-provider-dynamic.git" \
            "${{ runner.temp }}/ubx-provider-dynamic-src"

      - name: Set up Go
        if: steps.compare.outputs.state == 'drift' && steps.cfn.outputs.hash != steps.compare.outputs.current_cfn
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubiquex-src/go.mod

      - name: Set up Deno
        if: steps.compare.outputs.state == 'drift' && steps.cfn.outputs.hash != steps.compare.outputs.current_cfn
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.x"

      - name: Build ubx
        if: steps.compare.outputs.state == 'drift' && steps.cfn.outputs.hash != steps.compare.outputs.current_cfn
        run: |
          set -euo pipefail
          go build -C "${{ runner.temp }}/ubiquex-src" -o "${{ runner.temp }}/ubx" ./cmd/ubx
          "${{ runner.temp }}/ubx" version

      - name: Regenerate the CFN half only (all three languages, through the real pin)
        if: steps.compare.outputs.state == 'drift' && steps.cfn.outputs.hash != steps.compare.outputs.current_cfn
        env:
          UBX_PROVIDER_DYNAMIC_REPO: ${{ runner.temp }}/ubx-provider-dynamic-src
        run: |
          set -euo pipefail
          gendir="${{ runner.temp }}/ubxgen"
          mkdir -p "$gendir"

          own_ts_version="$(python3 -c "import json; print(json.load(open('sdk/typescript/package.json'))['version'])")"
          own_py_version="$(python3 -c "import tomllib; print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")"

          # UBI-240 slice 6: artifacts/aws/ now lives in this repo
          # (moved out of ubiquex-docs) -- an absolute path, captured
          # here while $PWD is still this repo's own root, before the
          # sdk gen invocation below cd's into sdk/providers. Until
          # ubiquex's own sdk/providers/.ubx/config drops
          # [dynamic_providers.aws.descriptions] (a separate,
          # sequenced change -- see that PR), that central config's own
          # pin still takes priority over this explicit flag
          # (resolveDescriptionsDir's own real precedence), so this is
          # a safe, harmless no-op until the pin is actually removed,
          # not a race.
          descriptions_dir="$PWD/artifacts/aws"

          for lang in go ts py; do
            ( cd "${{ runner.temp }}/ubiquex-src/sdk/providers" && "${{ runner.temp }}/ubx" sdk gen --only "$REPO_NAME" --lang "$lang" --out "$gendir/out" --descriptions-dir "$descriptions_dir" --require-clean-provenance )
          done

          cp "$gendir/out/$REPO_NAME/PROVENANCE.json" PROVENANCE.json
          rsync -a --delete --exclude='go.sum' "$gendir/out/$REPO_NAME/sdk/go/" sdk/go/
          rsync -a --delete --exclude='deno.json' --exclude='deno.lock' "$gendir/out/$REPO_NAME/sdk/typescript/" sdk/typescript/
          rsync -a --delete "$gendir/out/$REPO_NAME/sdk/python/" sdk/python/

          python3 -c "
          import json
          p = 'sdk/typescript/package.json'
          d = json.load(open(p))
          d['version'] = '$own_ts_version'
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          "
          python3 -c "
          import re
          p = 'sdk/python/pyproject.toml'
          content = open(p).read()
          content = re.sub(r'version = \"[^\"]+\"', 'version = \"$own_py_version\"', content, count=1)
          open(p, 'w').write(content)
          "

          cat > VERSION <<EOF
          spec-sha256: ${{ steps.cfn.outputs.hash }}
          smithy-merged-spec-sha256: ${{ steps.smithy.outputs.hash }}
          smithy-members: ${{ steps.smithy.outputs.members }}
          fetched: $(date -u +%Y-%m-%d)
          source: cfn=https://schema.cloudformation.us-east-1.amazonaws.com/CloudformationSchema.zip smithy=$SCHEMA_REPO's own manifest.json (published, UBI-222)
          EOF

      - name: Regenerate sdk/go/go.sum
        if: steps.compare.outputs.state == 'drift' && steps.cfn.outputs.hash != steps.compare.outputs.current_cfn
        run: |
          set -euo pipefail
          cd sdk/go
          go mod tidy

      - name: Sanity-check the regenerated Go tree still builds
        if: steps.compare.outputs.state == 'drift' && steps.cfn.outputs.hash != steps.compare.outputs.current_cfn
        run: |
          set -euo pipefail
          cd sdk/go
          go build ./...
          go vet ./...

      - name: Open PR (CFN-half regeneration only)
        if: steps.compare.outputs.state == 'drift' && steps.cfn.outputs.hash != steps.compare.outputs.current_cfn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ubx-bot"
          git config user.email "actions@users.noreply.github.com"
          short="$(echo "${{ steps.cfn.outputs.hash }}" | cut -c1-12)"
          branch="sdk-regen/aws-cfn-$short"
          git checkout -b "$branch"
          git add -A
          git commit -m "sdk: regenerate CFN half from spec-sha256 $short"
          git push origin "$branch" --force
          gh pr create \
            --title "sdk: regenerate CFN half from spec-sha256 $short" \
            --body "Automated CFN-half regeneration (\`.github/workflows/hash-watch.yml\`) triggered by a schema content change on the real, live AWS CloudFormation registry. The Smithy half's own drift, if any, is reported separately -- see this run's own tracking issue, it does not regenerate automatically. This never auto-merges." \
            --base main --head "$branch"

      - name: Fail this run's own status on error, so it never shows green by accident
        if: steps.compare.outputs.state == 'error'
        run: |
          echo "state: error -- ${{ steps.compare.outputs.detail }}"
          exit 1
