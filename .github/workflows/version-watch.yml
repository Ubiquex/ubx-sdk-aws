name: version-watch

# Weekly check against the real Terraform Registry provider-versions API
# for a newer hashicorp/aws release. On a newer version: bumps VERSION,
# re-runs `ubx sdk gen --lang go|ts|py --out .` against it (all three
# languages, one PR), and opens a PR with the combined diff for review.
# Never auto-merges (UBI-99/UBI-104/UBI-105, ported to UBI-138's single
# combined per-provider repo).
#
# Ported from the pre-consolidation ubx-sdk-aws-{go,ts,py}'s own proven
# version-watch.yml (same registry call, same $RUNNER_TEMP scratch-
# isolation -- a real rsync self-overlap bug there taught this, same
# `go build -C` flag order) -- adapted for UBI-138's sdk/go/,
# sdk/typescript/, sdk/python/ sibling-subdirectory layout instead of
# three separate repos each with the language at its own root.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-sdk-aws
        uses: actions/checkout@v4

      - name: Query Terraform Registry for the latest hashicorp/aws version
        id: registry
        run: |
          set -euo pipefail
          # Confirmed real API (HashiCorp's own docs): no auth needed.
          response="$(curl -sf https://registry.terraform.io/v1/providers/hashicorp/aws/versions)"
          latest="$(echo "$response" | jq -r '.versions[].version' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "registry query returned no versions -- failing loudly rather than silently no-op'ing" >&2
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Terraform Registry reports latest hashicorp/aws version: $latest"
          # Known, accepted limitation (UBI-99): `sort -V` on semver
          # strings is usually correct but not bulletproof against
          # pre-release tags (e.g. 6.60.0-beta1 could sort in a way that
          # triggers a bad auto-bump). Fine for v1; harden if HashiCorp
          # ever ships a pre-release that trips this.

      - name: Compare against this repo's pinned version
        id: compare
        run: |
          set -euo pipefail
          current="$(cat VERSION)"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "This repo was last generated from: $current"
          if [ "$current" = "${{ steps.registry.outputs.latest }}" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "Already current -- nothing to do."
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi

      # --- everything below only runs when a newer version was found ---

      - name: Check out ubiquex (to build ubx from source)
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          # Plain `git clone` into $RUNNER_TEMP -- deliberately OUTSIDE
          # this repo's own checkout (which doubles as $GITHUB_WORKSPACE).
          # ubx-sdk-aws-go's own first live run (pre-consolidation)
          # generated into a scratch dir INSIDE the repo checkout;
          # `rsync --delete`'s destination scan then treated its own
          # still-being-read source as extraneous destination content and
          # deleted it mid-transfer ("file has vanished", rsync exit 24).
          # Keeping every scratch path under $RUNNER_TEMP makes that
          # class of source/destination overlap structurally impossible.
          #
          # Fine-grained PAT, contents:read only on Ubiquex/ubiquex.
          # Needed because ubiquex is private and the default
          # GITHUB_TOKEN here is scoped to this repo (ubx-sdk-aws) only.
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.UBIQUEX_SOURCE_TOKEN }}@github.com/Ubiquex/ubiquex.git" \
            "${{ runner.temp }}/ubiquex-src"

      - name: Set up Go
        if: steps.compare.outputs.newer == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubiquex-src/go.mod

      - name: Set up Deno
        if: steps.compare.outputs.newer == 'true'
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.x"

      - name: Set up Python
        if: steps.compare.outputs.newer == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build ubx
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          # Built from ubiquex's own `main` HEAD, not a tagged release:
          # there's no release cadence yet that tracks feature landings,
          # so source-from-main is the only way to get `ubx sdk gen`'s
          # current, correct behavior (including UBI-138's own sdk/
          # nesting fix). Accepted tradeoff for v1: an ubiquex regression
          # on main could affect this workflow; revisit once a real
          # release process exists.
          # (`-C` must be the FIRST flag to `go build`.)
          go build -C "${{ runner.temp }}/ubiquex-src" -o "${{ runner.temp }}/ubx" ./cmd/ubx
          "${{ runner.temp }}/ubx" version

      - name: Regenerate bindings (all three languages)
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          gendir="${{ runner.temp }}/ubxgen"
          mkdir -p "$gendir/.ubx"
          cat > "$gendir/.ubx/config" <<EOF
          [providers]
          "hashicorp/aws" = "${{ steps.registry.outputs.latest }}"
          EOF
          # `ubx sdk gen` is schema-only: no Configure, no credentials
          # needed (confirmed by its own --help text, and by this job
          # never setting any AWS_*/cloud credential at all).
          #
          # Each language's own semver `version` field (package.json /
          # deno.json / pyproject.toml) is owned by publish.yml, not by
          # codegen -- codegen always writes "0.0.0" (sdk/codegen/
          # templates/{ts,py}.go's own hard-coded package-version
          # placeholder). Capture the real, currently-committed values
          # before regen overwrites them, restore after (UBI-135's own
          # own_version pattern, ported here for TS's package.json too,
          # not just Python's pyproject.toml -- the pre-consolidation
          # ubx-sdk-aws-ts repo's own version-watch.yml never restored
          # package.json's version at all, a real latent gap this port
          # closes rather than carries forward).
          own_ts_version="$(python3 -c "import json; print(json.load(open('sdk/typescript/package.json'))['version'])")"
          own_py_version="$(python3 -c "import tomllib; print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")"

          # UBI-153: seed the scratch output's own go.mod with this
          # repo's real, already-checked-out go.mod BEFORE generation
          # runs, so `ubx sdk gen`'s own real-value-preservation fix
          # (cli/sdk.go's resolveGoDirective) has something real to read
          # at its own real target path -- without this, `--out out`
          # always starts from a genuinely empty scratch dir every run,
          # and the fix's own fallback (the real go toolchain that built
          # that run's own ubx binary) silently wins instead, recreating
          # UBI-151's exact bug the moment this repo's own go.mod is
          # ever legitimately bumped ahead of it. Seeding happens
          # entirely within the scratch dir ($RUNNER_TEMP/ubxgen,
          # already outside this repo's own checkout, per this file's
          # own real rsync self-overlap precedent above) -- does not
          # touch that boundary at all.
          mkdir -p "$gendir/out/hashicorp-aws/sdk/go"
          cp sdk/go/go.mod "$gendir/out/hashicorp-aws/sdk/go/go.mod"

          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --lang go --out out )
          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --lang ts --out out )
          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --lang py --out out )

          # `--out` now writes a repo-shaped tree under
          # <out>/<source-sanitized>/sdk/<lang>/ (UBI-138); flatten each
          # language's own sdk/<lang>/ back onto this repo's own
          # sdk/<lang>/, matching the current commit's own layout.
          # go.sum, deno.json/deno.lock are hand/tooling-maintained, not
          # codegen output, and are excluded from the regeneration diff
          # the same way the pre-consolidation repos excluded them.
          rsync -a --delete \
            --exclude='go.sum' \
            "$gendir/out/hashicorp-aws/sdk/go/" sdk/go/
          rsync -a --delete \
            --exclude='deno.json' --exclude='deno.lock' \
            "$gendir/out/hashicorp-aws/sdk/typescript/" sdk/typescript/
          rsync -a --delete \
            "$gendir/out/hashicorp-aws/sdk/python/" sdk/python/

          python3 -c "
          import json
          p = 'sdk/typescript/package.json'
          d = json.load(open(p))
          d['version'] = '$own_ts_version'
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          "
          python3 -c "
          import re
          p = 'sdk/python/pyproject.toml'
          content = open(p).read()
          content = re.sub(r'version = \"[^\"]+\"', 'version = \"$own_py_version\"', content, count=1)
          open(p, 'w').write(content)
          "

          echo "${{ steps.registry.outputs.latest }}" > VERSION

      - name: Refresh sdk/typescript/deno.json's exports map for the regenerated tree
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          # deno.json's name/version/license/imports are hand/publish
          # -workflow-maintained (excluded above), but `exports` is an
          # explicit, generated, one-entry-per-file map (JSR export keys
          # don't support wildcards) -- it MUST be regenerated every run
          # or a new resource type file lands with no export entry,
          # silently unimportable from the published package (UBI-135).
          python3 - <<'PYEOF'
          import json, os

          with open("sdk/typescript/deno.json") as fh:
              cfg = json.load(fh)

          exports = {}
          for dirpath, _, filenames in os.walk("sdk/typescript/aws"):
              for f in sorted(filenames):
                  if not f.endswith(".ts"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), "sdk/typescript")
                  exports["./" + rel[:-3]] = "./" + rel

          cfg["exports"] = exports

          with open("sdk/typescript/deno.json", "w") as fh:
              json.dump(cfg, fh, indent=2)
              fh.write("\n")

          print(f"sdk/typescript/deno.json exports: {len(exports)} entries")
          PYEOF

      - name: Regenerate sdk/go/go.sum
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/go
          go mod tidy

      - name: Sanity-check the regenerated Go tree still builds
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/go
          go build ./...
          go vet ./...

      - name: Sanity-check the regenerated TS tree still typechecks
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          # Matches this project's own real TS tooling (deno.json tasks
          # throughout sdk/ts/), not tsc. `@ubx/sdk` is a real jsr:
          # dependency -- `--no-remote` structurally refuses to resolve
          # ANY remote specifier (jsr:/https:), cache or lockfile
          # notwithstanding, so `deno cache` (network, warms the
          # lockfile/module cache) followed by `deno check --frozen`
          # (cache-only from here; fails if the lockfile would need to
          # change) is the real offline-safe equivalent.
          cd sdk/typescript
          find . -name "*.ts" -print0 | xargs -0 deno cache
          find . -name "*.ts" -print0 | xargs -0 deno check --frozen

      - name: Sanity-check the regenerated Python tree -- real import of every module
        if: steps.compare.outputs.newer == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          # A real recursive `importlib.import_module` of every generated
          # module (not a syntax lint) -- `ubx_sdk` itself resolves via a
          # real PyPI install (its version pin read straight out of
          # pyproject.toml, so this can never drift from the real
          # declared version range).
          deps="$(cd sdk/python && python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")"
          pip install $deps
          python3 - <<'PYEOF'
          import os, sys, importlib

          repo_root = os.path.join(os.getcwd(), "sdk", "python")
          sys.path.insert(0, repo_root)

          count = 0
          errors = []
          for dirpath, dirnames, filenames in os.walk(repo_root):
              for f in filenames:
                  if not f.endswith(".py"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), repo_root)
                  mod = rel[:-3].replace(os.sep, ".")
                  if mod.endswith(".__init__"):
                      mod = mod[: -len(".__init__")]
                  try:
                      importlib.import_module(mod)
                      count += 1
                  except Exception as e:
                      errors.append((mod, str(e)))

          print(f"imported {count} modules OK")
          if errors:
              print(f"{len(errors)} ERRORS:")
              for m, e in errors:
                  print(f"  {m}: {e}")
              sys.exit(1)
          print("ZERO errors")
          PYEOF

      - name: Open PR
        if: steps.compare.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ubx-bot"
          git config user.email "actions@users.noreply.github.com"
          branch="sdk-regen/hashicorp-aws-${{ steps.registry.outputs.latest }}"
          git checkout -b "$branch"
          git add -A
          git commit -m "sdk: regenerate from hashicorp/aws@${{ steps.registry.outputs.latest }}"
          git push origin "$branch" --force
          gh pr create \
            --title "sdk: regenerate from hashicorp/aws@${{ steps.registry.outputs.latest }}" \
            --body "Automated regeneration (\`.github/workflows/version-watch.yml\`) triggered by a newer \`hashicorp/aws\` version on the Terraform Registry -- all three languages (sdk/go/, sdk/typescript/, sdk/python/) regenerated together in this one PR (UBI-138: one combined repo now, not three).

          Previous: \`${{ steps.compare.outputs.current }}\`
          New: \`${{ steps.registry.outputs.latest }}\`

          New files = new service. Modified files = an existing resource's schema changed. This never auto-merges -- review the diff before merging." \
            --base main --head "$branch"
